<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0078D4">
<title>Guest Check-in</title>
<style>
  /* ---- Tokens (match neerajagrawal.org) ---- */
  :root {
    --accent: #0078D4; --accent-dark: #005A9E; --accent-pale: #EFF6FC;
    --ok: #107C10; --ok-bg: #DFF6DD; --warn: #8A5300; --warn-bg: #FFF4CE; --err: #A4262C; --err-bg: #FDE7E9;
    --text: #1B1B1B; --text-2: #505050; --muted: #767676;
    --bg: #F8F9FA; --card: #FFFFFF; --border: #E1E1E1;
    --radius: 12px; --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --accent: #50ABF1; --accent-dark: #2B88D8; --accent-pale: #0F2A40;
      --ok: #6CCB5F; --ok-bg: #0E2A10; --warn: #FCE100; --warn-bg: #3A3000; --err: #F1707B; --err-bg: #3B1316;
      --text: #F3F3F3; --text-2: #C8C8C8; --muted: #9E9E9E;
      --bg: #121212; --card: #1E1E1E; --border: #333;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; border: 0; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* ---- Login ---- */
  #login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
  .login-card { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; }
  .login-card h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .login-card p { color: var(--text-2); margin-bottom: 20px; font-size: .95rem; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 6px; }
  .field { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; background: var(--card); color: var(--text); font-size: 1.05rem; }
  .field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px; font-weight: 600; font-size: 1rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { background: var(--accent-dark); }
  .btn-ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--border); }
  .btn-block { width: 100%; margin-top: 20px; }
  .err-msg { color: var(--err); margin-top: 12px; font-size: .9rem; min-height: 1.2em; }

  /* ---- App shell ---- */
  #app { display: flex; flex-direction: column; min-height: 100%; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--border); padding: 10px 16px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; margin: 0 auto; }
  .event-name { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: .8rem; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .sync-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 4px; vertical-align: middle; }
  .sync-dot.pending { background: #F7A000; } .sync-dot.offline { background: var(--err); }
  .counter { text-align: right; flex-shrink: 0; }
  .counter b { font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; }
  .counter span { color: var(--muted); font-size: .9rem; }
  .progress { height: 4px; background: var(--border); border-radius: 2px; margin: 8px auto 0; max-width: 760px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .searchwrap { max-width: 760px; margin: 10px auto 0; display: flex; gap: 8px; }
  #q { flex: 1; min-width: 0; font-size: 1.2rem; padding: 14px 16px; }
  #walkinBtn { flex-shrink: 0; padding: 0 14px; }

  main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 12px 16px 40px; }
  .hint { text-align: center; color: var(--muted); padding: 40px 12px; line-height: 1.6; }
  .hint b { color: var(--text-2); }
  .section-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }

  .guest { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 14px; margin-bottom: 8px; min-height: 64px; }
  .guest:active { transform: scale(.99); border-color: var(--accent); }
  .guest .info { flex: 1; min-width: 0; }
  .guest .nm { font-weight: 600; font-size: 1.08rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .guest .sub { font-size: .85rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat-pill { flex-shrink: 0; background: var(--accent-pale); color: var(--accent); font-weight: 700; padding: 6px 10px; border-radius: 8px; font-size: .95rem; max-width: 40%; text-align: center; }
  .seat-pill.none { background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: .8rem; }
  .guest.done { opacity: .62; }
  .guest .tag { font-size: .75rem; font-weight: 700; color: var(--ok); }
  .guest .tag.w { color: var(--accent); }
  mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; }

  /* ---- Result overlay ---- */
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
  .overlay.ok { background: var(--ok-bg); } .overlay.warn { background: var(--warn-bg); }
  .ov-status { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ok .ov-status { color: var(--ok); } .warn .ov-status { color: var(--warn); }
  .ov-name { font-size: clamp(1.6rem, 7vw, 2.6rem); font-weight: 700; margin: 10px 0 2px; line-height: 1.2; word-break: break-word; }
  .ov-sub { color: var(--text-2); font-size: .95rem; }
  .ov-seat-label { margin-top: 28px; font-size: .9rem; text-transform: uppercase; letter-spacing: .1em; color: var(--text-2); }
  .ov-seat { font-size: clamp(3.5rem, 22vw, 8rem); font-weight: 800; line-height: 1; color: var(--text); word-break: break-word; max-width: 100%; }
  .ov-seat.none { font-size: clamp(1.6rem, 8vw, 2.4rem); color: var(--warn); }
  .ov-actions { margin-top: 36px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ov-actions .btn { min-width: 140px; padding: 14px 20px; }
  .btn-undo { background: transparent; color: var(--text-2); border: 1.5px solid currentColor; }
  .ov-timer { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--ok); width: 100%; transform-origin: left; }
  .warn .ov-timer { display: none; }

  /* ---- Walk-in sheet ---- */
  .modal-bg { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; background: var(--card); border-radius: 20px 20px 0 0; padding: 22px 20px calc(22px + env(safe-area-inset-bottom)); max-height: 92vh; overflow: auto; }
  @media (min-width: 600px) { .modal-bg { align-items: center; } .sheet { border-radius: 20px; } }
  .sheet h2 { font-size: 1.25rem; }
  .sheet .row { display: flex; gap: 10px; margin-top: 20px; }
  .sheet .row .btn { flex: 1; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: #323130; color: #fff; padding: 12px 18px; border-radius: 10px; font-size: .92rem; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .demo-banner { background: var(--warn-bg); color: var(--warn); text-align: center; font-size: .8rem; font-weight: 600; padding: 4px; }
  .linkbtn { background: none; color: var(--accent); font-size: .8rem; padding: 0; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>Guest Check-in</h1>
    <p>Enter the event PIN and a name for this station.</p>
    <label for="pin">Event PIN</label>
    <input class="field" id="pin" type="password" inputmode="numeric" autocomplete="off" required>
    <label for="device">Station / volunteer name</label>
    <input class="field" id="device" type="text" placeholder="e.g. Door 1 – Priya" maxlength="40" required>
    <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Start check-in</button>
    <div class="err-msg" id="loginErr"></div>
  </form>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <header>
    <div class="topbar">
      <div style="min-width:0">
        <div class="event-name" id="eventName">Check-in</div>
        <div class="meta">
          <span id="syncState"><span class="sync-dot"></span>Synced</span>
          <span id="stationName"></span>
          <button class="linkbtn" id="refreshBtn" type="button">Refresh</button>
          <button class="linkbtn" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
      <div class="counter"><b id="cnt">0</b> <span>/ <span id="total">0</span></span></div>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="searchwrap">
      <input class="field" id="q" type="search" placeholder="Name or phone last 4" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="btn btn-ghost" id="walkinBtn" type="button" title="Add walk-in">+ Walk-in</button>
    </div>
  </header>
  <main id="results"></main>
</section>

<!-- ============ RESULT OVERLAY ============ -->
<div class="overlay hidden" id="overlay" role="dialog" aria-live="assertive">
  <div class="ov-status" id="ovStatus"></div>
  <div class="ov-name" id="ovName"></div>
  <div class="ov-sub" id="ovSub"></div>
  <div class="ov-seat-label">Seat</div>
  <div class="ov-seat" id="ovSeat"></div>
  <div class="ov-actions">
    <button class="btn btn-primary" id="ovNext" type="button">Next guest</button>
    <button class="btn btn-undo" id="ovUndo" type="button">Undo check-in</button>
  </div>
  <div class="ov-timer" id="ovTimer"></div>
</div>

<!-- ============ WALK-IN SHEET ============ -->
<div class="modal-bg hidden" id="walkinModal">
  <form class="sheet" id="walkinForm" autocomplete="off">
    <h2>Add walk-in guest</h2>
    <label for="wName">Full name *</label>
    <input class="field" id="wName" required maxlength="80">
    <label for="wPhone">Phone</label>
    <input class="field" id="wPhone" type="tel" maxlength="20">
    <label for="wEmail">Email</label>
    <input class="field" id="wEmail" type="email" maxlength="80">
    <label for="wSeat">Seat (if assigning one)</label>
    <input class="field" id="wSeat" maxlength="20">
    <div class="row">
      <button class="btn btn-ghost" type="button" id="wCancel">Cancel</button>
      <button class="btn btn-primary" type="submit">Check in</button>
    </div>
  </form>
</div>

<div class="toast hidden" id="toast"></div>

<script>
/* CONFIG – Apps Script Web App URL (ends with /exec). */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz7xI6ig_f3PvgI7gkpCJQtvfmb6_6WimK4tKDhqCSzAS5Tfs7CILkLyF6nGnRfbyTDWQ/exec';

const POLL_MS = 15000;       // how often to pull other stations' check-ins
const OVERLAY_MS = 4000;     // auto-close the green "checked in" screen

/* ------------------------- tiny storage helpers ------------------------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  sget(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
  sset(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }
};
const $ = id => document.getElementById(id);
// Clear anything left behind by the old demo version (fake check-ins must never reach the real sheet).
try { localStorage.removeItem('ci_demo_db_v1'); localStorage.removeItem('ci_queue'); } catch {}

/* ------------------------------- state --------------------------------- */
let PIN = store.sget('ci_pin') || '';
let DEVICE = store.get('ci_device', '');
let guests = [];                 // [{id,name,email,phone,seat,walkin}]
let byId = new Map();
let checkins = {};               // id -> {at, by}
let queue = store.get('ci_queue_live', []);   // pending ops [{op,id,at,device,...}]
let flushing = false, online = navigator.onLine, pollTimer = null;
let lastFull = 0;

/* --------------------------------- API ---------------------------------- */
async function api(action, payload = {}) {
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request: no CORS preflight
    body: JSON.stringify({ action, pin: PIN, ...payload }),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('Network error ' + res.status);
  const data = await res.json();
  if (!data.ok) { const e = new Error(data.error || 'Server error'); e.auth = !!data.auth; throw e; }
  return data;
}

/* ------------------------------- login ---------------------------------- */
$('device').value = DEVICE;
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  PIN = $('pin').value.trim();
  DEVICE = $('device').value.trim();
  store.set('ci_device', DEVICE);
  $('loginBtn').disabled = true; $('loginBtn').textContent = 'Loading guest list…'; $('loginErr').textContent = '';
  try {
    await loadAll();
    store.sset('ci_pin', PIN);
    showApp();
  } catch (err) {
    $('loginErr').textContent = err.message || 'Could not connect';
    PIN = '';
  } finally {
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'Start check-in';
  }
});

$('logoutBtn').onclick = () => {
  if (queue.length && !confirm(queue.length + ' check-in(s) have not synced yet. Sign out anyway? They will sync next time you sign in on this device.')) return;
  store.sset('ci_pin', null); PIN = ''; clearInterval(pollTimer);
  guests = []; byId = new Map(); checkins = {};
  $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('pin').value = '';
};

function showApp() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('stationName').textContent = DEVICE;
  render(); focusSearch();
  clearInterval(pollTimer); pollTimer = setInterval(poll, POLL_MS);
  flush();
}

/* ------------------------------ data load ------------------------------- */
async function loadAll() {
  const d = await api('load');
  $('eventName').textContent = d.event || 'Check-in';
  document.title = (d.event || 'Guest') + ' – Check-in';
  setGuests(d.guests || []);
  checkins = d.checkins || {};
  applyQueueLocally();
  lastFull = Date.now();
}
function setGuests(list) {
  guests = list.map(g => ({ ...g, _n: norm(g.name), _p: digits(g.phone), _e: (g.email || '').toLowerCase() }));
  guests.sort((a, b) => a.name.localeCompare(b.name));
  byId = new Map(guests.map(g => [g.id, g]));
}
function addGuest(g) {
  if (byId.has(g.id)) return;
  const x = { ...g, _n: norm(g.name), _p: digits(g.phone), _e: (g.email || '').toLowerCase() };
  guests.push(x); byId.set(x.id, x);
}
/* Pending (unsynced) ops are shown as already applied. */
function applyQueueLocally() {
  for (const op of queue) {
    if (op.op === 'walkin') { addGuest({ id: op.id, name: op.name, phone: op.phone, email: op.email, seat: op.seat, walkin: true }); checkins[op.id] = { at: op.at, by: op.device }; }
    else if (op.op === 'checkin') checkins[op.id] = checkins[op.id] || { at: op.at, by: op.device };
    else if (op.op === 'undo') delete checkins[op.id];
  }
}

async function poll() {
  if (!PIN || !navigator.onLine) return updateSync();
  try {
    if (Date.now() - lastFull > 10 * 60 * 1000) { await loadAll(); }   // pick up new RSVPs / seat changes
    else {
      const d = await api('status');
      (d.walkins || []).forEach(addGuest);
      checkins = d.checkins || {};
      applyQueueLocally();
    }
    online = true;
    if (!$('overlay').classList.contains('hidden')) return updateSync();
    render();
  } catch (e) { handleErr(e); }
  flush();
}
$('refreshBtn').onclick = async () => { toast('Refreshing…'); try { await loadAll(); render(); toast('Guest list refreshed'); } catch (e) { handleErr(e); } };

/* ---------------------------- sync queue -------------------------------- */
function enqueue(op) { queue.push(op); store.set('ci_queue_live', queue); updateSync(); flush(); }
async function flush() {
  if (flushing || !queue.length || !PIN) return updateSync();
  flushing = true;
  try {
    while (queue.length) {
      const op = queue[0];
      const res = await api(op.op, op);
      if (op.op === 'checkin' && res.already && res.by && res.by !== op.device) {
        const g = byId.get(op.id);
        toast(`Note: ${g ? g.name : 'Guest'} was already checked in at ${fmtTime(res.at)} by ${res.by}`, 6000);
        checkins[op.id] = { at: res.at, by: res.by };
      }
      queue.shift(); store.set('ci_queue_live', queue);
    }
    online = true;
  } catch (e) { handleErr(e); }
  finally { flushing = false; updateSync(); }
}
function handleErr(e) {
  if (e && e.auth) { toast(e.message + ' – please sign in again', 6000); $('logoutBtn').onclick(); return; }
  online = false; updateSync();
}
window.addEventListener('online', () => { online = true; flush(); poll(); });
window.addEventListener('offline', () => { online = false; updateSync(); });
setInterval(flush, 5000);

function updateSync() {
  const el = $('syncState');
  const off = !navigator.onLine || !online;
  const cls = off ? 'offline' : queue.length ? 'pending' : '';
  const txt = off ? `Offline${queue.length ? ' · ' + queue.length + ' waiting to sync' : ''}` : queue.length ? `Syncing ${queue.length}…` : 'Synced';
  el.innerHTML = `<span class="sync-dot ${cls}"></span>${txt}`;
}

/* ------------------------------- search --------------------------------- */
function norm(s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9@.\s]/g, ' ').replace(/\s+/g, ' ').trim(); }
function digits(s) { return String(s || '').replace(/\D/g, ''); }

function search(qRaw) {
  const q = norm(qRaw);
  if (!q) return [];
  const qd = digits(qRaw);
  if (qd.length >= 3 && qd.length === q.replace(/\s/g, '').length) {
    // numbers only -> phone search (last digits first)
    const ends = guests.filter(g => g._p.endsWith(qd));
    const has = guests.filter(g => !g._p.endsWith(qd) && g._p.includes(qd));
    return ends.concat(has);
  }
  if (q.includes('@')) return guests.filter(g => g._e.includes(q));
  const toks = q.split(' ');
  const scored = [];
  for (const g of guests) {
    const words = g._n.split(' ');
    if (!toks.every(t => words.some(w => w.startsWith(t)) || g._e.startsWith(t))) continue;
    scored.push([g._n.startsWith(q) ? 0 : 1, g]);
  }
  return scored.sort((a, b) => a[0] - b[0]).map(x => x[1]);
}

/* ------------------------------- render --------------------------------- */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function hl(text, q) {
  const toks = norm(q).split(' ').filter(Boolean);
  let out = esc(text);
  if (!toks.length) return out;
  const re = new RegExp('\\b(' + toks.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  return out.replace(re, '<mark>$1</mark>');
}
function maskPhone(p) { const d = digits(p); return d ? '•••' + d.slice(-4) : ''; }
function fmtTime(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }

function guestCard(g, q) {
  const ci = checkins[g.id];
  const seat = g.seat ? `<div class="seat-pill">${esc(g.seat)}</div>` : `<div class="seat-pill none">No seat</div>`;
  const subBits = [maskPhone(g.phone), g.email ? esc(g.email) : ''].filter(Boolean).join(' · ');
  const tag = ci ? `<div class="tag">✓ Checked in ${fmtTime(ci.at)}${ci.by ? ' · ' + esc(ci.by) : ''}</div>` : g.walkin ? `<div class="tag w">Walk-in</div>` : '';
  return `<button class="guest${ci ? ' done' : ''}" data-id="${esc(g.id)}" type="button">
    <div class="info"><div class="nm">${hl(g.name || '(no name)', q)}</div><div class="sub">${subBits}</div>${tag}</div>${seat}</button>`;
}

function render() {
  const total = guests.length;
  const done = Object.keys(checkins).filter(id => byId.has(id)).length;
  $('cnt').textContent = done; $('total').textContent = total;
  $('bar').style.width = total ? (done / total * 100) + '%' : '0';
  updateSync();

  const q = $('q').value;
  const box = $('results');
  if (!q.trim()) {
    const mine = Object.entries(checkins)
      .filter(([id, c]) => c.by === DEVICE && byId.has(id))
      .sort((a, b) => String(b[1].at).localeCompare(String(a[1].at))).slice(0, 8);
    box.innerHTML = `<div class="hint">Type a guest's <b>name</b> or the <b>last 4 digits</b> of their phone,<br>then tap their name to check them in.</div>` +
      (mine.length ? `<div class="section-title">Recently checked in at this station</div>` + mine.map(([id]) => guestCard(byId.get(id), '')).join('') : '');
    return;
  }
  const res = search(q);
  if (!res.length) {
    box.innerHTML = `<div class="hint">No RSVP found for “${esc(q)}”.<br>Try another spelling or the phone number, or add them as a <b>walk-in</b>.</div>`;
    return;
  }
  const top = res.slice(0, 40);
  box.innerHTML = top.map(g => guestCard(g, q)).join('') +
    (res.length > top.length ? `<div class="hint">${res.length - top.length} more – keep typing to narrow down</div>` : '');
}

let rT; $('q').addEventListener('input', () => { clearTimeout(rT); rT = setTimeout(render, 60); });
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter') {               // Enter checks in when exactly one match
    const res = search($('q').value);
    if (res.length === 1) openGuest(res[0].id);
  }
});
$('results').addEventListener('click', e => { const b = e.target.closest('.guest'); if (b) openGuest(b.dataset.id); });

function focusSearch() { const q = $('q'); q.value = ''; render(); setTimeout(() => q.focus(), 50); }

/* ------------------------------ check in -------------------------------- */
function openGuest(id) {
  const g = byId.get(id); if (!g) return;
  const ci = checkins[id];
  if (ci) return showOverlay(g, 'warn', ci);
  const at = new Date().toISOString();
  checkins[id] = { at, by: DEVICE };
  enqueue({ op: 'checkin', id, at, device: DEVICE, name: g.name });
  if (navigator.vibrate) navigator.vibrate(60);
  showOverlay(g, 'ok', checkins[id]);
}

let ovTimer, ovGuest;
function showOverlay(g, kind, ci) {
  ovGuest = g;
  const ov = $('overlay');
  ov.className = 'overlay ' + kind;
  $('ovStatus').innerHTML = kind === 'ok' ? '✓ Checked in' : '⚠ Already checked in';
  $('ovName').textContent = g.name;
  $('ovSub').textContent = kind === 'ok'
    ? (g.walkin ? 'Walk-in guest' : 'Welcome!')
    : `at ${fmtTime(ci.at)}${ci.by ? ' by ' + ci.by : ''}`;
  const s = $('ovSeat');
  s.textContent = g.seat || 'No seat assigned – send to help desk';
  s.className = 'ov-seat' + (g.seat ? '' : ' none');
  s.style.fontSize = g.seat && g.seat.length > 6 ? 'clamp(2.4rem, 13vw, 5.5rem)' : '';
  $('ovNext').textContent = kind === 'ok' ? 'Next guest' : 'Close';
  clearTimeout(ovTimer);
  const t = $('ovTimer');
  t.style.transition = 'none'; t.style.transform = 'scaleX(1)';
  if (kind === 'ok') {
    requestAnimationFrame(() => requestAnimationFrame(() => { t.style.transition = `transform ${OVERLAY_MS}ms linear`; t.style.transform = 'scaleX(0)'; }));
    ovTimer = setTimeout(closeOverlay, OVERLAY_MS);
  }
}
function closeOverlay() { clearTimeout(ovTimer); $('overlay').classList.add('hidden'); focusSearch(); }
$('ovNext').onclick = closeOverlay;
$('overlay').addEventListener('click', e => { if (e.target === $('overlay') && $('overlay').classList.contains('ok')) closeOverlay(); });
$('ovUndo').onclick = () => {
  if (!ovGuest) return;
  if (!confirm(`Undo check-in for ${ovGuest.name}?`)) return;
  delete checkins[ovGuest.id];
  enqueue({ op: 'undo', id: ovGuest.id, device: DEVICE });
  toast(`Check-in undone for ${ovGuest.name}`);
  closeOverlay();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').classList.contains('hidden')) closeOverlay(); });

/* ------------------------------- walk-in -------------------------------- */
$('walkinBtn').onclick = () => {
  $('walkinForm').reset();
  const q = $('q').value.trim();
  if (q && !/^\d+$/.test(q)) $('wName').value = q; else if (/^\d{7,}$/.test(q)) $('wPhone').value = q;
  $('walkinModal').classList.remove('hidden'); setTimeout(() => $('wName').focus(), 50);
};
$('wCancel').onclick = () => $('walkinModal').classList.add('hidden');
$('walkinModal').addEventListener('click', e => { if (e.target === $('walkinModal')) $('walkinModal').classList.add('hidden'); });
$('walkinForm').addEventListener('submit', e => {
  e.preventDefault();
  const g = { id: 'w:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: $('wName').value.trim(), phone: $('wPhone').value.trim(), email: $('wEmail').value.trim(), seat: $('wSeat').value.trim(), walkin: true };
  if (!g.name) return;
  const at = new Date().toISOString();
  addGuest(g);
  checkins[g.id] = { at, by: DEVICE };
  enqueue({ op: 'walkin', ...g, at, device: DEVICE });
  $('walkinModal').classList.add('hidden');
  showOverlay(byId.get(g.id), 'ok', checkins[g.id]);
});

/* -------------------------------- toast --------------------------------- */
let toastT;
function toast(msg, ms = 3000) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms); }

/* ------------------------------ auto resume ----------------------------- */
if (PIN && DEVICE) {
  loadAll().then(showApp).catch(err => { $('loginErr').textContent = err.message; PIN = ''; store.sset('ci_pin', null); });
}
</script>
</body>
</html>
