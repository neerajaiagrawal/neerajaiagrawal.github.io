<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="880" viewBox="0 0 1160 880" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>End-to-end flow and component responsibilities</title>
<desc>End-to-end dealing-instruction flow. SharePoint intake, a Power Automate pickup cloud flow, AI Builder extraction, one Copilot Studio agent (NORA) that classifies, sequences and routes while calling deterministic code and an LLM validator prompt, three routing buckets Auto Review Hold, Teams approvals, Dataverse audit, a model-driven queue app, Power BI, and Omni out of scope. Colour indicates type of work.</desc>
<rect x="0" y="0" width="1160" height="880" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round"/></marker></defs>

<text x="40" y="34" font-size="16" font-weight="600" fill="#2C2C2A">End-to-end flow &amp; component responsibilities &#8212; dealing instruction POC (NORA)</text>
<text x="40" y="54" font-size="11" fill="#5F5E5A">One autonomous agent orchestrates the process and calls tools. All arithmetic and identifier checks live in code the agent calls &#8212; never in its reasoning. Colour = type of work.</text>

<!-- BAND 1 : INTAKE & EXTRACTION -->
<text x="60" y="84" font-size="12" font-weight="600" fill="#8A8880">1 &#183; INTAKE &amp; EXTRACTION &#8212; Power Automate cloud flow + AI Builder (AI Builder credits)</text>

<rect x="60" y="96" width="196" height="70" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="158" y="126" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">SharePoint</text>
<text x="158" y="145" font-size="10.5" fill="#5F5E5A" text-anchor="middle">intake library &#183; drop zone</text>

<line x1="256" y1="131" x2="298" y2="131" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="300" y="96" width="260" height="70" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="430" y="120" font-size="13" font-weight="500" fill="#085041" text-anchor="middle">Power Automate &#8212; pickup flow</text>
<text x="430" y="138" font-size="10.5" fill="#0F6E56" text-anchor="middle">poll &#183; content-hash &#183; dedup</text>
<text x="430" y="154" font-size="10.5" fill="#0F6E56" text-anchor="middle">create Submission &#183; map &#183; invoke agent</text>

<line x1="560" y1="131" x2="602" y2="131" stroke="#5F5E5A" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>

<rect x="604" y="96" width="260" height="70" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
<text x="734" y="120" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle">AI Builder &#8212; document processing</text>
<text x="734" y="138" font-size="10.5" fill="#185FA5" text-anchor="middle">OCR (print + handwriting)</text>
<text x="734" y="154" font-size="10.5" fill="#185FA5" text-anchor="middle">fields &#183; tables &#183; key/values &#183; confidence</text>

<!-- pickup flow invokes agent -->
<line x1="430" y1="166" x2="430" y2="206" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="446" y="181" font-size="10" fill="#5F5E5A">pickup flow maps results to Dataverse, then invokes NORA (SubmissionId)</text>

<!-- BAND 2 : ORCHESTRATION -->
<text x="60" y="200" font-size="12" font-weight="600" fill="#8A8880">2 &#183; ORCHESTRATION &#8212; Copilot Studio autonomous agent (Copilot Credits)</text>

<rect x="300" y="210" width="560" height="92" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="580" y="238" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">Copilot Studio agent &#8212; NORA &#160;&#183;&#160; 1 agent</text>
<text x="580" y="260" font-size="10.5" fill="#534AB7" text-anchor="middle">classify type &#183; detect handwritten / multi-deal / multi-page &#183; sequence steps</text>
<text x="580" y="277" font-size="10.5" fill="#534AB7" text-anchor="middle">interpret contradictions &#183; choose routing bucket &#183; write the reason &#183; answer &#8220;why?&#8221;</text>
<text x="580" y="294" font-size="10" font-style="italic" fill="#7A72C9" text-anchor="middle">generative orchestration ON &#8212; reasons, never computes</text>

<!-- manual branch -->
<rect x="60" y="216" width="200" height="80" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="160" y="242" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Unsupported &#8594; Manual</text>
<text x="160" y="262" font-size="10.5" fill="#993C1D" text-anchor="middle">Cancellation &#183; Deceased/Estate</text>
<text x="160" y="278" font-size="10.5" fill="#993C1D" text-anchor="middle">Close-account &#183; Unknown</text>
<line x1="300" y1="256" x2="262" y2="256" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="280" y="228" font-size="9.5" fill="#5F5E5A" text-anchor="middle">not auto-eligible</text>

<!-- BAND 3 : TOOLS -->
<text x="60" y="328" font-size="12" font-weight="600" fill="#8A8880">3 &#183; TOOLS THE AGENT CALLS</text>

<rect x="300" y="338" width="260" height="78" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="430" y="360" font-size="12.5" font-weight="500" fill="#085041" text-anchor="middle">Deterministic code (C#)</text>
<text x="430" y="379" font-size="10.5" fill="#0F6E56" text-anchor="middle">Dataverse plug-in &#8212; in-tenant, no Azure</text>
<text x="430" y="396" font-size="10.5" fill="#0F6E56" text-anchor="middle">check-digit &#183; repair &#183; reconcile &#183; gate</text>

<rect x="600" y="338" width="260" height="78" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="730" y="362" font-size="12.5" font-weight="500" fill="#3C3489" text-anchor="middle">LLM validator prompt (in-tenant)</text>
<text x="730" y="381" font-size="10.5" fill="#534AB7" text-anchor="middle">cross-check structured vs raw text</text>
<text x="730" y="398" font-size="10.5" fill="#534AB7" text-anchor="middle">returns flags + verdict &#8212; suggests only</text>

<line x1="430" y1="302" x2="430" y2="336" stroke="#5F5E5A" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="730" y1="302" x2="730" y2="336" stroke="#5F5E5A" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="585" y="322" font-size="9.5" fill="#5F5E5A" text-anchor="middle">calls &#183; returns</text>

<!-- BAND 4 : SCORE & ROUTE -->
<text x="60" y="440" font-size="12" font-weight="600" fill="#8A8880">4 &#183; SCORE &amp; ROUTE</text>

<line x1="580" y1="302" x2="580" y2="450" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="590" y="440" font-size="9.5" fill="#5F5E5A">after validation</text>

<rect x="360" y="450" width="440" height="52" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="580" y="472" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Score composite confidence &#160;&#8594;&#160; Route</text>
<text x="580" y="490" font-size="10" fill="#5F5E5A" text-anchor="middle">capped by lowest critical-field confidence &#183; any hard rule forces &#8805; Review</text>

<line x1="580" y1="502" x2="230" y2="536" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="580" y1="502" x2="580" y2="536" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="580" y1="502" x2="930" y2="536" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>

<rect x="120" y="538" width="220" height="66" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="230" y="564" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">AUTO</text>
<text x="230" y="584" font-size="10" fill="#0F6E56" text-anchor="middle">&#8805;0.90 &#183; rules pass &#183; validator agrees</text>

<rect x="470" y="538" width="220" height="66" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="580" y="564" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle">REVIEW</text>
<text x="580" y="584" font-size="10" fill="#993C1D" text-anchor="middle">0.60&#8211;0.90 &#183; warning &#183; hard-rule fail</text>

<rect x="820" y="538" width="220" height="66" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="930" y="564" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle">HOLD / return</text>
<text x="930" y="584" font-size="10" fill="#5F5E5A" text-anchor="middle">&#60;0.60 &#183; unreadable &#183; unrecoverable</text>

<!-- BAND 5 : HUMAN + TERMINAL -->
<text x="60" y="640" font-size="12" font-weight="600" fill="#8A8880">5 &#183; HUMAN LOOP &amp; TERMINAL SURFACES (Omni out of scope)</text>

<line x1="580" y1="604" x2="580" y2="648" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="470" y="650" width="220" height="60" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="580" y="674" font-size="13" font-weight="500" fill="#712B13" text-anchor="middle">Teams approvals (human)</text>
<text x="580" y="693" font-size="10.5" fill="#993C1D" text-anchor="middle">Approve &#183; Correct &#183; Reject &#8594; ReviewLog</text>

<rect x="120" y="758" width="220" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="230" y="782" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Dataverse</text>
<text x="230" y="801" font-size="10.5" fill="#5F5E5A" text-anchor="middle">staging + full audit trail</text>

<rect x="470" y="758" width="220" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="580" y="782" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Model-driven queue app</text>
<text x="580" y="801" font-size="10.5" fill="#5F5E5A" text-anchor="middle">terminal surface &#183; work &amp; close</text>

<rect x="820" y="758" width="150" height="60" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="895" y="782" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle">Power BI</text>
<text x="895" y="801" font-size="10.5" fill="#5F5E5A" text-anchor="middle">oversight</text>

<rect x="990" y="758" width="120" height="60" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 4"/>
<text x="1050" y="782" font-size="13" font-weight="500" fill="#8A8880" text-anchor="middle">Omni</text>
<text x="1050" y="801" font-size="10.5" fill="#8A8880" text-anchor="middle">out of scope</text>

<!-- terminal arrows -->
<line x1="230" y1="604" x2="230" y2="756" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="520" y1="710" x2="330" y2="757" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="930" y1="604" x2="700" y2="757" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="340" y1="788" x2="468" y2="788" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="690" y1="788" x2="818" y2="788" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<path d="M690 806 L690 826 L1050 826 L1050 820" fill="none" stroke="#B4B2A9" stroke-width="1.1" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="866" y="821" font-size="9" fill="#8A8880" text-anchor="middle">future hand-off seam</text>

<!-- manual to dataverse -->
<path d="M100 296 L100 788 L118 788" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/>
<text x="104" y="540" font-size="9.5" fill="#5F5E5A" transform="rotate(90 104 540)">manual queue + audit</text>

